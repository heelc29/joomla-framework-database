name: CI Joomla Framework

on:
    push:
    pull_request:
    schedule:
        - cron: 15 2 * * 1

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    tests-unit-sqlite:
        name: Run Unit tests on SQLite
        runs-on: ubuntu-latest
        container: joomlaprojects/docker-images:php${{ matrix.php_version }}
        strategy:
            matrix:
                php_version: ['8.3', '8.4', '8.5']
        steps:
            - uses: actions/checkout@v6
            - name: Run Unit tests
              run: |
                  git config --global --add safe.directory $GITHUB_WORKSPACE
                  composer update
                  ./vendor/bin/phpunit --configuration phpunit.sqlite.xml.dist --display-all-issues
