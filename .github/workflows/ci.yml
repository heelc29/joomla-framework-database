name: CI Joomla Framework

on:
    push:
    pull_request:
    schedule:
        - cron: 15 2 * * 1

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    tests-unit-sqlsrv:
        name: Run Unit tests on SQLsrv
        runs-on: ubuntu-latest
        container: joomlaprojects/docker-images:php${{ matrix.php_version }}
        strategy:
            matrix:
                php_version: ['8.3', '8.4', '8.5']
                db_version: ['2017']
        steps:
            - uses: actions/checkout@v6
            - name: Prepare SQLSRV environment
              run: |
                  curl -sSL -O https://packages.microsoft.com/config/debian/$(grep VERSION_ID /etc/os-release | cut -d '"' -f 2 | cut -d '.' -f 1)/packages-microsoft-prod.deb
                  dpkg -i packages-microsoft-prod.deb
                  rm packages-microsoft-prod.deb
                  apt-get update
                  ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
                  pecl install sqlsrv && docker-php-ext-enable sqlsrv
                  pecl install pdo_sqlsrv && docker-php-ext-enable pdo_sqlsrv
                  php --ri sqlsrv
                  php --ri pdo_sqlsrv
            - name: Run Unit tests
              run: |
                  git config --global --add safe.directory $GITHUB_WORKSPACE
                  composer update
                  ./vendor/bin/phpunit --configuration phpunit.sqlsrv.xml.dist --display-all-issues
        services:
            sqlsrv:
                image: mcr.microsoft.com/mssql/server:${{ matrix.db_version }}-latest
                env:
                    ACCEPT_EULA: Y
                    MSSQL_SA_PASSWORD: Password12!
                    MSSQL_PID: Developer
