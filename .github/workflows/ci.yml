name: CI Joomla Framework

on:
    push:
    pull_request:
    schedule:
        - cron: 15 2 * * 1

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    tests-unit-windows:
        name: Run Unit tests on MSSQL (Windows)
        runs-on: windows-latest
        strategy:
            matrix:
                php_version: ['8.3', '8.4', '8.5']
        steps:
            - uses: actions/checkout@v6
            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
              with:
                  php-version: ${{ matrix.php_version }}
                  extensions: openssl, mbstring, fileinfo, ftp, sqlsrv
            - name: Install MSSQL
              uses: potatoqualitee/mssqlsuite@2291d923e83859edd871679c05b379037376761f # v1.12
              with:
                  install: sqlengine, sqlclient
                  version: 2019
                  sa-password: 'Password12!'
                  show-log: true
            - name: Install Composer dependencies
              run: |
                  git config --global --add safe.directory ${env:GITHUB_WORKSPACE}
                  composer update
            - name: Run Unit tests
              run: php vendor/bin/phpunit -c phpunit.windows.xml.dist --display-all-issues
